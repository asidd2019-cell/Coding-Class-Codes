<!DOCTYPE html>
<html>
<head>
    <style>

        .table-parent{
            width: 100%;
            border: 2px solid grey;
            border-radius: 10px;
        }

        table{
            border-radius: 10px;
            width: 100%;
            border-collapse: separate;
            border-spacing: 0px;
        }

        thead{
            background-color: rgb(22, 15, 32);
            color: white;
        }

        td{
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="table-parent">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Order ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>2017-09-29 01:22</td>
                    <td>200398</td>
                    <td>IPhone X 54Gb Grey</td>
                    <td>$999.00</td>
                    <td>1</td>
                    <td>$999.00</td>
                </tr>

                <tr>
                    <td>2017-09-28 05:57</td>
                    <td>200397</td>
                    <td>Samsun S8 Black</td>
                    <td>$756.00</td>
                    <td>1</td>
                    <td>$756.00</td>
                </tr>

                <tr>
                <td>2017-09-26 05:57</td> 
                <td>200396</td>
                <td>Game Console Controller</td>
                <td>$22.00</td>
                <td>2</td>
                <td>$44.00</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
