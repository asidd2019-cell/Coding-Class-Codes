<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="styles.css">
<head>
</head>
<body>
    <div class="form-parent">
        <form>
            <div class="input-fields">
                <div class="inputs">
                    <label for="NameofTask">Name</label>
                    <input type="text" id="NameofTask" placeholder="Enter Name Here">
                </div>

                <div class="inputs">
                    <label for="DescriptionofTask">Description</label>
                    <input type="text" id="DescriptionofTask" placeholder="Enter Description">
                </div>

                <div class="inputs">
                    <label for="StartofTask">Start</label>
                    <input type="date" id="StartofTask">
                </div> 

                <div class="inputs">
                    <label for="EndofTask">End</label>
                    <input type="date" id="EndofTask">
                </div>
            </div>

            <div class="add-task">
                <button>Add +</button>
            </div>

            <table>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Update</th>
                    <th>Delete</th>
                </tr>
            </table>
    </form>
    </div>
</body>
</html>
