<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <div class="title-span">
            <span class="title">Notes</span>
        </div>

        <div class="input">
            <textarea id="textarea" placeholder="Type your note here"></textarea>
            <button class="add-note" id="add_button">Add Note</button>
        </div>

        <div class="notes" id="notes">
        </div>
    </div>

    <div class="modal">
            <textarea id="editNote" placeholder="Type your note here"></textarea>
            <button class="save-button">Save</button>
    </div>
</body>
<script src="script.js"></script>
</html>
