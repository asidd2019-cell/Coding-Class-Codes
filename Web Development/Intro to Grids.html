<!DOCTYPE html>
<html>
<head>
    <style>
        
.parent {
    display: flex;
    height: 500px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
}
    
.div1 {
    background-color: green;
    grid-column: span 3 / span 3;
    grid-row: span 3 / span 3;
}

.div2 {
    background-color: orange;
    grid-column: span 2 / span 2;
    grid-row: span 2 / span 2;
    grid-column-start: 1;
    grid-row-start: 4;
}

.div3 {
    background-color: orange;
    grid-column: span 2 / span 2;
    grid-row: span 2 / span 2;
    grid-column-start: 3;
    grid-row-start: 4;
}

.div4 {
    background-color: purple;
    grid-row: span 3 / span 3;
    grid-column-start: 4;
    grid-row-start: 1;
}

header{
    height: 100px;
    background-color: rgb(40, 104, 223);
    margin-bottom: 8px;
}

footer{
    height: 100px;
    background-color: rgb(4, 41, 161);
    margin-top: 8px;
}
    </style>
</head>
<body>

<header></header> 

<div class="parent">
    <div class="div1">1</div>
    <div class="div2">2</div>
    <div class="div3">3</div>
    <div class="div4">4</div>
</div>

<footer></footer>
    
</body>
</html>
