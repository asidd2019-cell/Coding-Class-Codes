<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <style>
            .form-parent{
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .checkbox-parent{
                margin-top: 20px;
                margin-bottom: 20px;
                display: flex;
                flex-direction: row;
            }

            form{
                gap: 10px;
                height: 280px;
                width: 500px;
                font-size: 25px;
                font-family: "Gill Sans", sans-serif;
                border-radius: 20px;
                padding: 50px;
                background-color: rgb(247, 244, 244);
                display: flex;
                flex-direction: column;
            }

            .field-size{
                font-size: 20px;
                border-radius: 10px;
                padding-top: 10px;
                padding-bottom: 10px;
                height: 100px;
            }

            input{
                border: 2px solid rgb(201, 198, 198);
                background-color: rgb(247, 244, 244);
            }

            .submit-button{
                padding: 5px;
                border-radius: 10px;
                padding-top: 12px;
                padding-bottom: 12px;
                width: 90px;
                background-color: rgb(31, 77, 226);
                color: white;
            }

            span{
                color: rgb(31, 77, 226);
            }
            
        </style>
    </head>

    <body>
        <div class="form-parent">
            <form>
                <label for="email">Your Email</label>
                <input class="field-size" type="email" placeholder="Enter Your Email Here" id="email">
                <label for="password">Your password</label>
                <input class="field-size" type="password" placeholder="Enter Your Password Here" id="password">
                <div class="checkbox-parent">
                    <input type="checkbox" id="checkbox">
                    <label for="checkbox">I agree with the <span>terms and conditions</span>.</label>
                </div>

                <input class="submit-button" type="submit" id="submit">
            </form>
        </div>
    </body>
</html>
