<!DOCTYPE html>
<html>
<head>
    <style>
        .form-parent{
            height: 100vh;
            display: flex;
            justify-content: center;  
            align-items: center;
        }

        form{
            height: 280px;
            width: 275px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        input{
            border: none;
            border-bottom: 1px solid grey;
        }

        input:focus{
            border: none;
            border-bottom: 1px solid rgb(22, 95, 206);
            outline: none;
        }

        button{
            box-shadow: none;
            border: none;
            padding-top: 10px;
            padding-bottom: 10px;
            height: 75px;
            width: 75px;
            color: white;
            background-color: rgb(35, 87, 230);
            border-radius: 7px;
        }

        button:hover{
            background-color: rgb(14, 70, 224);
        }

        .field{
            position: relative;
        }

        .field label{
            position: absolute;
            left: 1px;
            top: -5px;
            transition: 0.25s;
        }

        .field input:focus + label{
            top: -20px;
            font-size: 10px;
            color: rgb(22, 95, 206);
        }

    </style>
</head>

<body>
    <div class="form-parent">
        <form>
            <div class="field">
                <input type="email" id="email">
                <label for="email">Email Address</label>
            </div>

            <div class="field">
                <input type="password" id="password">
                <label for="password">Password</label>
            </div>

            <div class="field">
                <input type="password" id="confirm-password">
                <label for="confirm-password">Confirm Password</label>
            </div>

            <div class="field">
                <input type="text" id="first-name">
                <label for="first-name">First Name</label>
            </div>

            <div class="field">
                <input type="text" id="last-name">
                <label for="last-name">Last Name</label>
            </div>

            <div class="field">
                <input type="number" id="phone-number">
                <label for="phone-number">Phone Number</label>
            </div>

            <div class="field">
                <input type="text" id="company">
                <label for="company">Company</label>
            </div>

            <button type="submit">Submit</button>
        </form> 
    </div>
</body>
</html>
